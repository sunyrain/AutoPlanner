[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# These trees are frozen research surfaces retained for reproducibility.  The
# production V4 packages and the entire test suite remain under the strict rule
# set above; new code must not be added to these exceptions.
[tool.ruff.lint.per-file-ignores]
"cascade_planner/cascade_search/*.py" = ["E402", "F402"]
"cascade_planner/cascadeboard/*.py" = ["E402", "E702", "E731", "F402", "F541", "F841"]
"cascade_planner/data/*.py" = ["E401", "E701", "E702", "F541"]
"cascade_planner/eval/*.py" = ["E401", "E402", "E701", "E702", "F541", "F841"]
"cascade_planner/vnext/*.py" = ["F841"]
"scripts/*.py" = ["E402", "F541"]
