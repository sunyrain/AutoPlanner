name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 18 * * 1"
  workflow_dispatch:
    inputs:
      full_windows:
        description: Run the complete offline suite on Windows
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  AUTOPLANNER_LIVE_CODEX_ENTRY_SMOKE: "0"
  AUTOPLANNER_TRUSTED_LITERATURE_STEP_REGISTRY: tests/fixtures/trusted_literature_step_registry.json

jobs:
  quality-and-safety:
    name: Quality and safety gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source without retaining a push credential
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Ruff
        run: python -m pip install "ruff>=0.12,<1"

      - name: Reject syntax errors and undefined names across active Python
        run: >-
          python -m ruff check --no-cache --select E9,F63,F7,F82
          cascade_planner scripts tests

      - name: Enforce strict lint on the upgraded architecture surface
        run: >-
          python -m ruff check --no-cache
          cascade_planner/application
          cascade_planner/providers
          cascade_planner/routes
          cascade_planner/runtime
          cascade_planner/harness/reaction_step_verifier.py
          cascade_planner/harness/route_verifier.py
          cascade_planner/harness/parent_route_proof.py
          cascade_planner/harness/stitched_route.py
          scripts/audit_architecture_v2.py
          scripts/migrate_codex_campaign_v2.py
          tests/test_artifact_revision.py
          tests/test_audit_architecture_v2.py
          tests/test_builtin_providers.py
          tests/test_chem_enzy_runtime_preflight.py
          tests/test_frontier_scheduler.py
          tests/test_generic_hardcoding_guards.py
          tests/test_parent_route_proof.py
          tests/test_portfolio_controller_integration.py
          tests/test_provider_registry.py
          tests/test_reaction_step_verifier.py
          tests/test_route_consensus.py
          tests/test_route_consensus_graph.py
          tests/test_route_forest.py
          tests/test_route_portfolio.py
          tests/test_route_source_adapters.py
          tests/test_route_verifier.py
          tests/test_stock_provider.py

      - name: Reject tracked credential files and private-token signatures
        shell: bash
        run: |
          set -euo pipefail
          tracked_sensitive="$({ git ls-files | grep -Ei '(^|/)(key\.txt|psaaword\.txt|secret_key|[^/]*credentials[^/]*\.json|[^/]*\.sqlite3(-wal|-shm)?|id_rsa[^/]*|id_ed25519[^/]*|[^/]*\.(pem|p12|pfx|key)|\.env(\..*)?)$' || true; } | grep -Ev '(^|/)\.env(\.local)?\.example$' || true)"
          if [[ -n "${tracked_sensitive}" ]]; then
            printf 'Tracked credential files are forbidden:\n%s\n' "${tracked_sensitive}" >&2
            exit 1
          fi
          if git grep -I -n -E -- 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|sk-[A-Za-z0-9_-]{20,}|github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,}'; then
            printf 'A tracked file matches a private-key or live-token signature.\n' >&2
            exit 1
          fi

  architecture-contracts:
    name: Architecture contracts (${{ matrix.os }})
    needs: quality-and-safety
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install fast-contract dependencies
        run: >-
          python -m pip install
          "pytest>=8.2,<10"
          "numpy>=1.26,<2.0"
          "rdkit>=2023.9.1,<2024.0"

      - name: Run cross-platform architecture, proof, fusion, and hardcoding gates
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_child_agent_runtime_contracts.py
          tests/test_generic_hardcoding_guards.py
          tests/test_route_consensus.py
          tests/test_route_consensus_graph.py
          tests/test_route_source_adapters.py
          tests/test_route_verifier.py
          tests/test_reaction_step_verifier.py
          tests/test_provider_registry.py
          tests/test_portfolio_controller_integration.py
          tests/test_stock_provider.py
          tests/test_frontier_scheduler.py
          tests/test_route_portfolio.py
          tests/test_builtin_providers.py
          tests/test_audit_architecture_v2.py
          tests/test_chem_enzy_runtime_preflight.py

  full-linux:
    name: Complete offline suite (Linux)
    needs: quality-and-safety
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install CPU-only PyTorch
        run: >-
          python -m pip install torch==2.3.0
          --index-url https://download.pytorch.org/whl/cpu

      - name: Install offline test stack
        run: python -m pip install -r requirements-dev.txt

      - name: Run every offline test
        run: >-
          python -m pytest -q -p no:cacheprovider
          --durations=20
          --junitxml=test-results/full-linux.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-full-linux
          path: test-results/full-linux.xml
          if-no-files-found: warn

  full-windows:
    name: Complete offline suite (Windows, scheduled/manual)
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.full_windows)
    needs: quality-and-safety
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install CPU-only PyTorch
        run: >-
          python -m pip install torch==2.3.0
          --index-url https://download.pytorch.org/whl/cpu

      - name: Install offline test stack
        run: python -m pip install -r requirements-dev.txt

      - name: Run every offline test
        run: >-
          python -m pytest -q -p no:cacheprovider
          --durations=20
          --junitxml=test-results/full-windows.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-full-windows
          path: test-results/full-windows.xml
          if-no-files-found: warn
