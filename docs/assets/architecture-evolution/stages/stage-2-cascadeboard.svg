<text x="704.0" y="232" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#617b8c"><tspan x="704.0" dy="0">RetroChimera / EnzExpand 填分子</tspan></text>
<rect x="990" y="160" width="340" height="120" rx="18" fill="#ffffff" stroke="#2bb89b" stroke-width="2" filter="url(#shadow)"/>
<rect x="990" y="160" width="9" height="120" rx="4" fill="#2bb89b"/>
<text x="1164.0" y="198" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#0b2438"><tspan x="1164.0" dy="0">Layer 3 · Route Scoring</tspan></text>
<text x="1164.0" y="232" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#617b8c"><tspan x="1164.0" dy="0">完整路线排序与兼容性</tspan></text>
