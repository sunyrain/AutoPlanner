<text x="820" y="494" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="600" fill="#617b8c"><tspan x="820" dy="0">Slot 3</tspan></text>
<line x1="850" y1="440" x2="1000" y2="440" stroke="#8299a8" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="1035" cy="440" r="27" fill="#22a9c1" stroke="#ffffff" stroke-width="4" filter="url(#shadow)"/>
<text x="1035" y="494" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="600" fill="#617b8c"><tspan x="1035" dy="0">起始料</tspan></text>
<rect x="880" y="360" width="430" height="170" rx="18" fill="#fbfaff" stroke="#7a78d9" stroke-width="2" filter="url(#shadow)"/>
<rect x="880" y="360" width="9" height="170" rx="4" fill="#7a78d9"/>
<text x="1099.0" y="398" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#0b2438"><tspan x="1099.0" dy="0">隐含假设</tspan></text>
<text x="1099.0" y="432" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#617b8c"><tspan x="1099.0" dy="0">主路线接近线性</tspan><tspan x="1099.0" dy="23">路线质量可由单一 scorer 排序</tspan><tspan x="1099.0" dy="23">候选空间覆盖了正确路线</tspan></text>
<rect x="250" y="560" width="900" height="90" rx="18" fill="#fff8f7" stroke="#d85d6b" stroke-width="2" filter="url(#shadow)"/>
<rect x="250" y="560" width="9" height="90" rx="4" fill="#d85d6b"/>
<text x="704.0" y="598" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#0b2438"><tspan x="704.0" dy="0">迁移压力</tspan></text>
<text x="704.0" y="632" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#617b8c"><tspan x="704.0" dy="0">会聚 AND 语义、共享中间体、证据版本和开放研究无法自然装进 slot chain</tspan></text>
