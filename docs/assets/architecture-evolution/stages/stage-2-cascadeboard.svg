<text x="244.0" y="232" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#617b8c"><tspan x="244.0" dy="0">全局反应类型 / EC / 条件骨架</tspan></text>
<rect x="530" y="160" width="340" height="120" rx="18" fill="#ffffff" stroke="#e7a83d" stroke-width="2" filter="url(#shadow)"/>
<rect x="530" y="160" width="9" height="120" rx="4" fill="#e7a83d"/>
