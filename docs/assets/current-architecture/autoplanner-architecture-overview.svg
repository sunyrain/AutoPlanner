<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
  <title id="title">AutoPlanner current architecture overview</title>
  <desc id="desc">One Canonical Host runs paper-matched and self-correcting sequential search. Model and provider outputs are proposals; Host replay, canonical ingestion, exact stock and independent validation own facts. Explicit Run Registry Catalog federation discovers owning run indexes without copying their state.</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-20%" width="124%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0B2637" flood-opacity=".10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2478D4"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#D88A24"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#7557C7"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; }
      .kicker { font-size: 15px; font-weight: 700; letter-spacing: 2px; }
      .heading { font-size: 31px; font-weight: 700; }
      .subtitle { font-size: 15px; }
      .lane-title { font-size: 16px; font-weight: 700; letter-spacing: 1px; }
      .node-title { font-size: 18px; font-weight: 700; }
      .node-sub { font-size: 13px; }
      .tiny { font-size: 12px; }
      .badge { font-size: 11px; font-weight: 700; letter-spacing: .6px; }
      .node { filter: url(#shadow); }
      .flow { fill: none; stroke: #2478D4; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
      .proposal { fill: none; stroke: #D88A24; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 7; marker-end: url(#arrow-orange); }
      .review { fill: none; stroke: #7557C7; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 5 6; marker-end: url(#arrow-purple); }
      .loop { fill: none; stroke: #2478D4; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 8; marker-end: url(#arrow-blue); }
    </style>
  </defs>

