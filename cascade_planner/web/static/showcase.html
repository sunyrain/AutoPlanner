<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AutoPlanner · 路线证据展台</title>
  <style>
    :root{color-scheme:light;--bg:#f4f6fb;--panel:#fff;--ink:#162033;--muted:#69758c;--line:#dce2ec;--brand:#4058d6;--brand-soft:#eef1ff;--green:#08785d;--green-soft:#eaf9f3;--amber:#b25b08;--amber-soft:#fff5e9;--red:#b4233b;--red-soft:#fff0f3;--l3:#0f766e;--l2:#2563eb;--l1:#4f46e5;--l0:#ea580c;--reject:#be123c;--shadow:0 16px 45px rgba(28,39,75,.09)}
    *{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;color:var(--ink);background:radial-gradient(circle at 4% -10%,#e5eaff 0,transparent 32rem),var(--bg);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.top{height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 20px;border-bottom:1px solid rgba(198,206,222,.85);background:rgba(255,255,255,.9);backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:12px;min-width:0}.mark{width:42px;height:42px;display:grid;place-items:center;border:1px solid #bac5ff;border-radius:13px;background:linear-gradient(145deg,#fff,#edf0ff);color:var(--brand);font-weight:900}.eyebrow{font-size:10px;font-weight:850;letter-spacing:.16em;color:var(--muted)}h1{margin:1px 0 0;font-size:19px;line-height:1.2}.topActions{display:flex;align-items:center;gap:8px}.topActions a,.topActions button{border:1px solid var(--line);border-radius:9px;padding:8px 11px;color:#38445b;background:#fff;text-decoration:none;font-weight:700;cursor:pointer}.topActions [hidden]{display:none}.shell{height:calc(100vh - 72px);display:grid;grid-template-columns:340px minmax(0,1fr);gap:12px;padding:12px}.side,.viewer{min-width:0;min-height:0;border:1px solid var(--line);border-radius:15px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}.side{display:flex;flex-direction:column}.sideHead{padding:16px;border-bottom:1px solid var(--line)}.sideHead h2{font-size:15px;margin:0 0 4px}.sideHead p{margin:0;color:var(--muted);font-size:12px}.standard{margin-top:11px;padding:9px 10px;border:1px solid #c9d1ff;border-radius:10px;background:var(--brand-soft);color:#3348b0;font-size:11px;font-weight:700}.legend{display:flex;flex-wrap:wrap;gap:6px;padding:11px 14px;border-bottom:1px solid var(--line)}.legend span{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:10px}.dot{width:8px;height:8px;border-radius:3px;background:var(--c)}.caseList{min-height:0;overflow:auto;padding:10px;display:grid;align-content:start;gap:8px}.case{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;text-align:left;color:inherit;background:#fff;cursor:pointer}.case:hover{border-color:#aebaf5}.case.active{border-color:#8798f3;box-shadow:0 0 0 3px rgba(64,88,214,.09);background:#f9faff}.case:disabled{cursor:not-allowed;opacity:.62}.caseTop{display:flex;align-items:center;justify-content:space-between;gap:8px}.caseName{font-size:14px;font-weight:850;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge{flex:none;border:1px solid;border-radius:999px;padding:3px 7px;font-size:9px;font-weight:850}.badge.closed{color:var(--green);border-color:#b5dfd1;background:var(--green-soft)}.badge.warn{color:var(--amber);border-color:#ebcda7;background:var(--amber-soft)}.badge.pending{color:var(--red);border-color:#edbec8;background:var(--red-soft)}.caseMeta{display:flex;gap:7px;margin-top:7px;color:var(--muted);font-size:11px}.proofs{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.proof{border-left:3px solid var(--c);padding:2px 6px;background:#f7f8fb;border-radius:3px;color:#4a566d;font-size:10px}.sideFoot{padding:11px 14px;border-top:1px solid var(--line);background:#fafbfe;color:var(--muted);font-size:10px}.viewer{display:flex;flex-direction:column}.viewerHead{min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:10px 14px;border-bottom:1px solid var(--line)}.viewerTitle{min-width:0}.viewerTitle b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.viewerTitle span{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.viewerActions{display:flex;gap:7px}.viewerActions a,.viewerActions button{border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:#40506a;background:#fff;text-decoration:none;font-weight:700;font-size:11px;cursor:pointer}.frameWrap{position:relative;min-height:0;flex:1;background:#edf0f7}.frameWrap iframe{width:100%;height:100%;border:0;background:#fff}.empty{position:absolute;inset:0;display:grid;place-items:center;padding:30px;text-align:center;color:var(--muted)}.empty[hidden]{display:none}.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:5px}.rerun{padding:9px 14px;border-top:1px solid var(--line);display:flex;gap:12px;overflow:auto;background:#fafbfe;color:var(--muted);font-size:10px}.rerun span{white-space:nowrap}.rerun b{color:var(--ink)}.catalogDialog{width:min(1080px,calc(100vw - 36px));max-height:min(800px,calc(100vh - 36px));padding:0;border:1px solid #cfd6e4;border-radius:16px;color:var(--ink);background:#fff;box-shadow:0 30px 90px rgba(20,30,60,.25)}.catalogDialog::backdrop{background:rgba(17,25,43,.42);backdrop-filter:blur(4px)}.catalogHead{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;gap:20px;padding:17px 19px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.96)}.catalogHead h2{margin:0;font-size:17px}.catalogHead p{margin:3px 0 0;color:var(--muted);font-size:11px}.catalogHead button{align-self:flex-start;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;cursor:pointer}.catalogGrid{padding:13px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.catalogRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fbfcff}.catalogRow b{display:block;font-size:13px}.catalogRow small{display:block;margin-top:3px;color:var(--muted);overflow-wrap:anywhere}.catalogStats{color:#3f4e66!important;font-weight:700}.catalogWarnings{color:var(--red)!important}.catalogBadges{display:flex;align-items:flex-end;gap:5px;flex-direction:column}.scope,.readiness{border-radius:999px;padding:3px 7px;font-size:9px;font-weight:850;white-space:nowrap}.scope{color:var(--green);background:var(--green-soft)}.scope.history{color:var(--amber);background:var(--amber-soft)}.scope.research{color:var(--red);background:var(--red-soft)}.readiness.high{color:var(--green);background:var(--green-soft)}.readiness.medium{color:var(--amber);background:var(--amber-soft)}.readiness.low,.readiness.warning{color:var(--red);background:var(--red-soft)}
    @media(max-width:960px){body{overflow:auto;height:auto}.shell{height:auto;grid-template-columns:1fr}.side{max-height:none}.caseList{grid-template-columns:repeat(2,minmax(0,1fr));overflow:visible}.viewer{height:78vh}.topActions a:first-child{display:none}}@media(max-width:620px){.top{padding:0 10px}.shell{padding:8px}.caseList{grid-template-columns:1fr}.viewerHead{align-items:flex-start}.viewerActions button{display:none}}
  </style>
</head>
<body>
  <header class="top">
    <div class="brand"><div class="mark">AP</div><div><div class="eyebrow">PRESENTATION · CLOSURE AXES</div><h1>复杂分子路线证据展台</h1></div></div>
    <nav class="topActions"><button id="openStatins" type="button">他汀谱系</button><a id="openReruns" href="#" target="_blank" rel="noopener" hidden>V4 实跑审计</a><a href="/v4">统一工作区</a><a href="/v4/console">运行控制台</a><button id="refresh" type="button">刷新清单</button></nav>
  </header>
  <main class="shell">
    <aside class="side">
      <div class="sideHead"><h2>当前展示案例</h2><p>结构、反应、文献/条件与库存/采购闭合分轴展示。</p><div id="standard" class="standard">正在加载闭合优先标准…</div></div>
      <div class="legend" aria-label="信源与证明颜色"><span><i class="dot" style="--c:var(--l3)"></i>L3 精确来源</span><span><i class="dot" style="--c:var(--l2)"></i>L2 主机验证</span><span><i class="dot" style="--c:var(--l1)"></i>L1 文献报道</span><span><i class="dot" style="--c:var(--l0)"></i>L0 规划</span><span><i class="dot" style="--c:var(--reject)"></i>拒绝/警示</span></div>
      <div id="cases" class="caseList"></div>
      <div id="message" class="sideFoot">清单由生成工件驱动，入口本身不升级科学结论。</div>
    </aside>
    <section class="viewer">
      <div class="viewerHead"><div class="viewerTitle"><b id="activeName">选择一个案例</b><span id="activeNote">路线工作台将在此处打开</span></div><div class="viewerActions"><button id="reloadFrame" type="button">重载工作台</button><a id="openPage" href="#" target="_blank" rel="noopener">独立打开</a></div></div>
      <div class="frameWrap"><iframe id="frame" title="路线工作台" sandbox="allow-scripts allow-same-origin"></iframe><div id="empty" class="empty"><div><strong>正在准备展示入口</strong><span>读取闭合路线与 V4 重跑状态…</span></div></div></div>
      <div id="reruns" class="rerun"><span><b>V4 重跑</b> 等待状态</span></div>
    </section>
  </main>
  <dialog id="statinDialog" class="catalogDialog">
    <div class="catalogHead"><div><h2 id="catalogTitle">他汀目标谱系</h2><p id="catalogNote">按独立母体化学实体归一化，别名与盐型不重复计数。</p></div><button id="closeStatins" type="button">关闭</button></div>
    <div id="catalogGrid" class="catalogGrid"></div>
  </dialog>
  <script>
    const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    let payload=null,active=null;
    const proofColor=tier=>tier.startsWith('L3')?'var(--l3)':tier.startsWith('L2')?'var(--l2)':tier.startsWith('L1')?'var(--l1)':tier.includes('rejected')?'var(--reject)':'var(--l0)';
    function renderCases(){const host=document.getElementById('cases');host.innerHTML=(payload.cases||[]).map(row=>{const selected=active?.case_id===row.case_id;const closedCount=Number(row.graph_closed_program_count||Number(row.route_closed===true)),declaredCount=Number(row.declared_program_count||0),known=declaredCount>0||typeof row.route_closed==='boolean',closed=closedCount>0;const status=known?(closed?(row.process_ready?'closed':'warn'):'pending'):'warn';const label=known?(closed?`${closedCount}/${declaredCount||closedCount} 结构闭合`:'结构未闭合'):'闭合待 current 投影';const sourceMeta=Number(row.source_reference_count||0)>0?`${row.source_reference_count} 来源候选${Number(row.source_group_count||0)>0?` / ${row.source_group_count} 已绑定`:''}`:Number(row.source_group_count||0)>0?`${row.source_group_count} 独立信源组`:'0 来源';const dist=Object.entries(row.proof_distribution||{}).filter(([,n])=>Number(n)>0);return `<button class="case ${selected?'active':''}" data-case="${esc(row.case_id)}" ${row.available?'':'disabled'}><div class="caseTop"><span class="caseName">${esc(row.display_name||row.target_name)}</span><span class="badge ${status}">${label}</span></div><div class="caseMeta"><span>${esc(row.max_step_count||row.step_count||0)} 步（描述）</span><span>${esc(sourceMeta)}</span><span>${esc(row.category||'复杂分子')}</span></div><div class="proofs">${dist.map(([tier,count])=>`<span class="proof" style="--c:${proofColor(tier)}">${esc(tier)} · ${esc(count)}</span>`).join('')||'<span class="proof" style="--c:var(--muted)">证据分布待投影</span>'}</div></button>`}).join('')||'<div class="empty"><div><strong>暂无可用案例</strong><span>请先从运行控制台生成工作台。</span></div></div>';host.querySelectorAll('[data-case]').forEach(button=>button.addEventListener('click',()=>selectCase(button.dataset.case)));}
    function selectCase(id){const row=(payload.cases||[]).find(item=>item.case_id===id&&item.available);if(!row)return;active=row;renderCases();document.getElementById('activeName').textContent=row.display_name||row.target_name;document.getElementById('activeNote').textContent=row.presentation_note||row.claim_status||'';document.getElementById('frame').src=row.artifact_url;document.getElementById('empty').hidden=true;document.getElementById('openPage').href=row.artifact_url;}
    function renderReruns(){const rows=payload.reruns||[];document.getElementById('reruns').innerHTML=rows.length?rows.map(row=>`<span><b>${esc(row.label||row.panel_id)}</b> · ${esc(row.status||'等待')} · ${esc(row.complete_target_count||0)}/${esc(row.target_count||0)} 完成运行</span>`).join(''):'<span><b>V4 重跑</b> 尚无状态</span>';}
    function renderStatins(){const catalog=payload?.statin_catalog||{};const rows=catalog.targets||[];document.getElementById('catalogTitle').textContent=`他汀路线就绪度 · ${catalog.entity_count||rows.length} 个独立母体`;const summary=catalog.readiness_summary||{};document.getElementById('catalogNote').textContent=`${catalog.normalization_note||'按独立母体化学实体归一化。'} 当前：${summary.long_route_observed||0} 个长路线，${summary.current_canonical_replay_attested||0} 个 current replay，${summary.conditioned_route_observed||0} 个含条件观察。`;const scopeLabel={marketed_core:'核心上市品种',withdrawn_historical:'历史撤市品种',lead_compound:'天然先导物',investigational_historical:'历史研发品种'};const readinessLabel={current_canonical_accepted:'current 已验收',current_canonical_unaccepted:'current 未验收',candidate_long_route:'长路线候选',candidate_short_route:'短路线候选',empty_workbench_only:'仅空图',not_observed:'尚未观测'};const warningLabel={NO_ROUTE_OBSERVED:'无路线',EMPTY_WORKBENCH_ONLY:'仅空图',INVALID_SNAPSHOT_PRESENT:'含无效快照',CANDIDATE_ONLY_NO_CURRENT_REPLAY:'无 current replay',ONLY_SHORT_ROUTES_OBSERVED:'仅短路线',NO_CONDITION_OBSERVATIONS:'条件缺失',NO_REPORTED_SOURCE_REFS:'来源未绑定',PORTFOLIO_ACCEPTED_CLAIM_WITHOUT_CURRENT_REPLAY:'accepted 声称未获 current 证明',CURRENT_REPLAY_NOT_ROUTE_ACCEPTED:'current 未验收',CURRENT_REPLAY_MISSING_CONDITIONS:'current 条件未闭合',CURRENT_REPLAY_NOT_LITERATURE_GROUNDED:'current 文献未闭合'};document.getElementById('catalogGrid').innerHTML=rows.map(row=>{const cls=row.scope==='marketed_core'?'':row.scope==='investigational_historical'?'research':'history';const wave=row.rerun_wave==='v4_first_9'?'首批 V4':'扩展 V4';const ready=row.route_readiness||{};const obs=ready.observations||{};const warnings=(ready.warning_codes||[]).map(code=>warningLabel[code]||code);return `<article class="catalogRow"><div><b>${esc(row.display_name)} · ${esc(row.target_name)}</b><small>${esc((row.aliases||[]).join(' / ')||'无重复别名')} · ${wave}</small><small class="catalogStats">${esc(obs.max_route_steps||0)} 步 · L${esc(obs.best_proof_level||0)} · 条件 ${esc(obs.condition_observation_edge_count||0)} 边 · 来源 ${esc(obs.reported_source_ref_count||0)}</small><small class="catalogWarnings">${esc(warnings.join(' · ')||'当前无警示')}</small></div><div class="catalogBadges"><span class="readiness ${esc(ready.confidence||'warning')}">${esc(readinessLabel[ready.readiness]||ready.readiness||'未审计')}</span><span class="scope ${cls}">${esc(scopeLabel[row.scope]||row.scope)}</span></div></article>`}).join('')||'<div>暂无他汀目录。</div>';}
    async function load(){document.getElementById('message').textContent='正在读取统一展示目录…';try{const response=await fetch('/api/v4/showcase',{cache:'no-store'});payload=await response.json();document.getElementById('standard').textContent=payload.standard?.summary||'闭合优先：路线长度只作描述，证据与库存独立核算。';document.getElementById('message').textContent=payload.message||'';document.getElementById('openStatins').textContent=`他汀谱系 ${payload.statin_catalog?.entity_count||''}`.trim();const audit=(payload.audits||[]).find(row=>row.available);const auditLink=document.getElementById('openReruns');auditLink.hidden=!audit;if(audit)auditLink.href=audit.artifact_url;const preferred=(payload.cases||[]).find(row=>row.case_id===payload.standard_case_id&&row.available)||(payload.cases||[]).find(row=>row.available);active=preferred||null;renderCases();renderReruns();if(active)selectCase(active.case_id);else document.getElementById('empty').hidden=false;}catch(error){document.getElementById('message').textContent=`清单加载失败：${error.message}`;}}
    document.getElementById('refresh').addEventListener('click',load);document.getElementById('reloadFrame').addEventListener('click',()=>{if(active){const frame=document.getElementById('frame');frame.src=active.artifact_url;}});document.getElementById('openStatins').addEventListener('click',()=>{renderStatins();document.getElementById('statinDialog').showModal();});document.getElementById('closeStatins').addEventListener('click',()=>document.getElementById('statinDialog').close());load();
  </script>
</body>
</html>
