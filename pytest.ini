[pytest]
pythonpath = .
testpaths = tests
addopts =
    --strict-config
    --strict-markers
norecursedirs =
    .git
    .pytest_cache
    AI_OS_AutoResearch
    archive
    data_external
    releases
    results
    vendor
python_files = test_*.py
junit_family = xunit2
xfail_strict = true
faulthandler_timeout = 120
markers =
    live: opt-in test that may require a real provider, network access, or credentials; never run in default CI
